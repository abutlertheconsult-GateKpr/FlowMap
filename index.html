<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowMap by Structure and Flow</title>
<meta name="theme-color" content="#1c2430">
<meta name="description" content="FlowMap: map how systems and data fit together, then print a clean PDF.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowMap">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#eef0f2;--paper:#fff;--ink:#1c2430;--mute:#667085;--line:#b8c0cc;--accent:#1f4e79}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px;background:var(--ink)}
.bar button,.bar label{font:inherit;font-size:14px;padding:6px 11px;border-radius:6px;border:1px solid #4b5668;background:#2a3544;color:#fff;cursor:pointer}
.bar .go{background:var(--accent);border-color:var(--accent);font-weight:600}
.bar .on{background:#b45309;border-color:#b45309}
.bar .sp{flex:1}
#msg{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:30;background:#b45309;color:#fff;padding:8px 14px;border-radius:6px;font-size:14px}
.page{position:relative;max-width:900px;margin:20px auto;padding:28px 30px 40px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
#ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
.title{width:100%;font:700 26px system-ui,sans-serif;border:0;border-bottom:2px solid var(--ink);padding:4px 0;background:transparent;color:var(--ink)}
.meta{display:flex;gap:16px;margin:8px 0 6px;color:var(--mute);font-size:13px;align-items:center;flex-wrap:wrap}
.meta input{font:inherit;color:var(--ink);border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 22px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.kids{--lc:var(--own);margin-left:14px;padding-left:18px}
.node{margin:10px 0;position:relative}
.kids>.node::before{content:"";position:absolute;left:-18px;top:22px;width:18px;border-top:3px solid var(--lc)}
.kids>.node::after{content:"";position:absolute;left:-18px;top:-10px;bottom:-10px;border-left:3px solid var(--lc)}
.kids>.node:last-child::after{bottom:auto;height:35px}
.card{border:1px solid var(--line);border-left:6px solid var(--own);border-radius:6px;background:#fff;padding:8px 10px}
.drop{outline:3px solid #2563eb}
.head{display:flex;gap:6px;align-items:center}
.head select{font:600 12px system-ui,sans-serif;color:#fff;border:0;border-radius:4px;padding:4px 6px;appearance:none;-webkit-appearance:none;text-align:center}
.ty-system{background:#1c2430}.ty-module{background:#1f6fb5}.ty-source{background:#c2710c}.ty-data{background:#1b8a5a}.ty-store{background:#7a3fb0}.ty-note{background:#6b7280}
.clr{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;flex:none;overflow:hidden}
.clr::-webkit-color-swatch-wrapper{padding:0}.clr::-webkit-color-swatch{border:0;border-radius:50%}
.head .name{flex:1;min-width:0;font:700 16px system-ui,sans-serif;border:0;background:transparent;color:var(--own);padding:4px}
.head .name:focus,.note:focus{outline:2px solid #9bbbe0;border-radius:4px}
.tools{display:flex;gap:2px}
.tools button{font:inherit;font-size:13px;min-width:30px;height:30px;border:1px solid transparent;background:transparent;border-radius:5px;cursor:pointer;color:var(--mute)}
.tools button:hover{background:#eef0f2;border-color:var(--line)}
.note{width:100%;margin-top:4px;border:0;background:transparent;resize:none;font:14px/1.45 system-ui,sans-serif;color:#3a4558;padding:4px;overflow:hidden;display:block}
.collapsed>.kids{display:none}
.count{font-size:12px;color:var(--mute);padding:0 4px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.hint{color:var(--mute);font-size:13px}
.arrowmode,.arrowmode .card *{cursor:crosshair}
#panel{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:25;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;max-width:96vw;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#panel select,#panel input:not([type=color]),#panel button{font:inherit;font-size:14px;padding:5px 8px;border-radius:6px;border:1px solid #4b5668;background:#2a3544;color:#fff}
#panel input[type=color]{width:34px;height:30px;padding:0;border:0;background:none}
#panel[hidden],#msg[hidden]{display:none}
.ic{color:var(--own);background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.cb{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:none;color:var(--mute);cursor:pointer;font:600 12px system-ui,sans-serif}
.cb.has{color:#b45309;background:#fff4e0;border-color:#f0c987}
.cbox{display:none;margin-top:6px;padding:6px 8px;background:#fffbeb;border-left:3px solid #f0c987;border-radius:4px}
.cbox.open,body.printing .cbox.has{display:block}
.cm{display:flex;gap:6px;align-items:flex-start}
.cm .note{margin:0;background:transparent}
.ct{font-size:11px;color:var(--mute);white-space:nowrap;padding-top:6px}
.cm button{border:0;background:none;color:var(--mute);cursor:pointer;padding-top:4px}
.cadd{display:flex;gap:6px;margin-top:4px}
.cadd input{flex:1;min-width:0;font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.cadd button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
#pick,#fp{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:70vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#pick{width:310px}
#fp{top:56px;right:16px;width:310px;z-index:28}
#pick[hidden],#fp[hidden]{display:none}
.ph,.fh{font-weight:700;font-size:13px;margin:6px 0 4px;color:var(--mute)}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc{position:relative}
.pb{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:11px system-ui,sans-serif;color:var(--ink)}
.pb:hover{background:#eef3f9}
.pf{position:absolute;top:0;right:2px;border:0;background:none;cursor:pointer;font-size:15px;color:#b8c0cc;padding:0 2px}
.pf.on{color:#d99a00}
.fl label{display:block;padding:3px 0;font-weight:600;cursor:pointer}
.fb{display:flex;gap:8px;margin-top:8px}
#fp button,#fnote button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:#f4f5f7;cursor:pointer}
#fnote{background:#fff4e0;border:1px solid #f0c987;border-radius:6px;padding:6px 10px;margin-bottom:10px;color:#7a4a05}
#fnote[hidden]{display:none}
.rt:empty::before{content:attr(data-ph);color:#98a2b3;pointer-events:none}
.rt div{margin:0}
.note{word-break:break-word;min-height:1.45em}
#fmt{position:fixed;z-index:45;display:flex;gap:2px;background:var(--ink);padding:4px;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#fmt[hidden]{display:none}
#fmt button{width:30px;height:28px;border:0;border-radius:5px;background:#2a3544;color:#fff;font:15px system-ui,sans-serif;cursor:pointer}
#panel label{font-size:13px;color:#cfd6e2;display:flex;align-items:center;gap:6px}
#pa,#ps{display:contents}
#pa[hidden],#ps[hidden]{display:none}
#shapes{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
.shape{position:absolute;pointer-events:auto;touch-action:none}
.sbody{width:100%;height:100%;border:2px solid;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:6px;cursor:move;overflow:hidden}
.sbody.circle{border-radius:50%}
.stext{max-width:88%;min-width:28px;outline:none;text-align:center;font:600 14px system-ui,sans-serif;color:var(--ink);cursor:text;word-break:break-word}
.shape.sel .sbody{outline:3px solid #9bbbe0;outline-offset:2px}
.srz{display:none;position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#fff;border:2.5px solid #2563eb;cursor:nwse-resize}
.shape.sel .srz{display:block}
#hdr{background:var(--ink);color:#fff;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 112px;font:15px/1.15 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.2px}
#hdr b{font-size:19px}
#gear{position:fixed;top:10px;right:10px;z-index:60;width:40px;height:40px;border-radius:8px;border:1px solid #4b5668;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
body.d-right #gear{right:60px}
#saveBtn{position:fixed;top:10px;right:58px;z-index:60;width:40px;height:40px;border-radius:8px;border:1px solid #4b5668;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
#saveBtn.ok{background:#1b8a5a;border-color:#1b8a5a}
body.d-right #saveBtn{right:110px}
@media (max-width:600px){#hdr{padding:6px 112px 6px 56px}}
#settings{position:fixed;top:58px;right:10px;z-index:55;width:340px;max-width:calc(100vw - 20px);max-height:80vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
body.d-right #settings{right:60px}
body.m-open.d-right #settings{right:230px}
#settings[hidden]{display:none}
.db.has{color:#1f4e79;background:#e8f1fb;border-color:#b9d3ee}
.dbox{display:none;margin-top:6px;padding:6px 8px;background:#f3f8fd;border-left:3px solid #b9d3ee;border-radius:4px}
.dbox.open,body.printing .dbox.has{display:block}
.dr{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.dr .din{flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
.dr .din[data-df="u"]{flex:2}
.dopen{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--accent);border:1px solid var(--line);border-radius:6px;background:#fff;flex:none}
.dr button{border:0;background:none;color:var(--mute);cursor:pointer}
.dp{display:none}
.dp a{color:#1f4e79;text-decoration:underline}
.dh{color:var(--mute);font-size:12px}
.dadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dadd input{flex:1 1 140px;min-width:0;font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.dadd button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.sh{font-weight:700;font-size:16px;margin-bottom:4px}
.ss{font-weight:700;font-size:13px;color:var(--mute);margin:12px 0 4px}
.mr{display:flex;gap:6px;margin-bottom:4px}
.mr input{flex:1;min-width:0;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.mr.cur input{border-color:var(--accent);background:#f1f6fc}
.sb{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#settings button,#settings .btn{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#f4f5f7;cursor:pointer;color:var(--ink)}
.bar select{font:inherit;font-size:14px;padding:7px 8px;border-radius:6px;border:1px solid #4b5668;background:#2a3544;color:#fff;min-width:170px;max-width:100%}
.ig{display:flex;flex-wrap:wrap;gap:4px}
.bar .ib{position:relative;width:38px;height:36px;padding:0;display:inline-grid;place-items:center}
.ib[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-5px;right:-5px;background:#b45309;color:#fff;border-radius:8px;font-size:11px;line-height:15px;padding:0 5px}
.bar .wide{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.dr{flex-wrap:wrap}
.dr .din{flex:1 1 120px}
.dr .din[data-df="u"]{flex:2 1 160px}
.drsel,.dadd select{font:inherit;font-size:13px;padding:4px 5px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
.drsel{flex:none;max-width:130px}
.dadd select{flex:0 1 150px}
.dvr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #e6e9ee}
.dvr input,.dvr select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;min-width:0;background:#fff}
.dvr input[data-drf="name"],#dvn{flex:1 1 120px}
.dvr input[data-drf="url"],#dvu{flex:1 1 100%}
.dvo{font-size:14px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#f4f5f7;color:var(--accent);text-decoration:none}
@media screen{
#hb{position:fixed;top:10px;left:10px;z-index:60;width:40px;height:40px;border-radius:8px;border:1px solid #4b5668;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
body.d-right #hb{left:auto;right:10px}
#hb.ghost{opacity:.28;width:30px;height:30px;top:6px}
#hb.ghost:hover{opacity:1}
#menu{display:none}
body.m-open #menu{display:flex}
body.d-top #menu{padding-left:62px;min-height:60px}
body.d-left #menu,body.d-right #menu{position:fixed;top:0;bottom:0;width:214px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;overflow-y:auto;padding:58px 10px 14px}
body.d-left #menu{left:0}
body.d-right #menu{right:0}
body.d-left #menu>button,body.d-right #menu>button,body.d-left #menu>label,body.d-right #menu>label{text-align:left}
body.d-left #menu .sp,body.d-right #menu .sp{flex:0 0 8px}
body.m-open.d-left{padding-left:214px}
body.m-open.d-right{padding-right:214px}
body.m-open.d-right #fp{right:230px}
.page{margin-top:20px}
body.m-open.d-top .page{margin-top:20px}
.seg{display:flex;flex-wrap:wrap}
.seg button{flex:1;border-radius:0!important}
.seg button:first-child{border-radius:6px 0 0 6px!important}
.seg button:last-child{border-radius:0 6px 6px 0!important}
.seg .sl{color:#aab4c3;font-size:13px;padding:7px 8px 0 0;flex:none}
.bar .sel{background:var(--accent)!important;border-color:var(--accent)!important}
.grip,.rsz{display:none}
.grip{width:26px;height:30px;place-items:center;border:0;background:none;cursor:grab;color:var(--mute);touch-action:none;flex:none;font-size:18px;padding:0}
.rsz{position:absolute;right:-6px;top:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.rsz:hover{background:rgba(37,99,235,.25);border-radius:6px}
body.free:not(.printing) .page{max-width:none;width:max-content;min-width:900px}
body.free:not(.printing) .title,body.free:not(.printing) .meta,body.free:not(.printing) .legend{max-width:860px}
body.free:not(.printing) #tree{position:relative}
body.free:not(.printing) #tree>.node.root{position:absolute;left:var(--x,0px);top:var(--y,0px);width:var(--w,520px);margin:0;padding:10px;background:#fff;border:1px dashed var(--line);border-radius:10px}
body.free:not(.printing) .node.root>.card .grip{display:inline-grid}
body.free:not(.printing) #tree>.node.root>.rsz{display:block}
}
@media print{
 @page{margin:14mm}
 body{background:#fff}
 .bar,.tools,.noprint,#panel,#msg{display:none!important}
 .page{border:0;margin:0;padding:0;max-width:none}
 .collapsed>.kids{display:block}
 .node{break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .note:placeholder-shown{display:none}
 .cb:not(.has){display:none}
 .dr,.dadd{display:none!important}
 .dbox:not(.has){display:none!important}
 .dp{display:block;margin:2px 0}
 .cadd,.cm button{display:none}
 .ic{border-color:transparent}
 #pick,#fp,#hb,#menu,#fmt,#hdr,#gear,#saveBtn,#settings{display:none!important}
 body{padding:0!important}
 .rt:empty{display:none}
 .srz{display:none!important}
 .shape.sel .sbody{outline:none}
}
</style>
</head>
<body>
<header id="hdr"><span><b>FlowMap</b> by Structure and Flow</span></header>
<button id="saveBtn" onclick="manualSave()" title="Save changes (Ctrl+S)" aria-label="Save"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/></svg></button>
<button id="gear" onclick="toggleSettings()" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<button id="hb" onclick="toggleMenu()" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="bar" id="menu">
  <select id="mapSel" onchange="switchMap(this.value)" aria-label="Maps"></select>
  <button class="wide" onclick="addMap()" title="Add a new map"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Add map</button>
  <button class="go wide" onclick="doPrint()">Save as PDF</button>
  <div class="seg"><button id="lyList" onclick="setLayout('list')">List layout</button><button id="lyFree" onclick="setLayout('free')">Free layout</button></div>
  <div class="ig">
   <button class="ib" onclick="addRoot()" title="Add box" aria-label="Add box"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg></button><button class="ib" onclick="addShape('rect')" title="Add square" aria-label="Add square"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14"/></svg></button><button class="ib" onclick="addShape('circle')" title="Add circle" aria-label="Add circle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/></svg></button><button class="ib" id="arrowBtn" onclick="toggleArrow()" title="Add arrow" aria-label="Add arrow"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M14 7l5 5-5 5"/></svg></button><button class="ib" onclick="toggleArrow(true)" title="Add two-way arrow" aria-label="Add two-way arrow"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button><button class="ib" onclick="doUndo()" title="Undo (Ctrl+Z)" aria-label="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/></svg></button><button class="ib" onclick="doRedo()" title="Redo (Ctrl+Y)" aria-label="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h4"/></svg></button><button class="ib" onclick="setAll(true)" title="Expand all" aria-label="Expand all"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button><button class="ib" onclick="setAll(false)" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l5 5 5-5M7 19l5-5 5 5"/></svg></button><button class="ib" id="focusBtn" onclick="toggleFocus()" title="Focus on chosen boxes" aria-label="Focus on chosen boxes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
  </div>
  <span class="sp"></span>
  <div class="seg"><span class="sl">Menu</span><button id="dkTop" onclick="setDock('top')">Top</button><button id="dkLeft" onclick="setDock('left')">Left</button><button id="dkRight" onclick="setDock('right')">Right</button></div>

</div>

<div id="fp" hidden></div>
<div id="settings" hidden></div>
<div id="pick" hidden></div>

<div class="page" id="page">
  <input class="title" id="title" placeholder="Name of the system you are mapping">
  <div class="meta"><span>Date <input id="date" type="date"></span><span>Mapped by <input id="by" placeholder="your name"></span></div>

</div>

  <select id="pst"><option value="solid">Solid line</option><option value="dashed">Dashed line</option><option value="dotted">Dotted line</option></select>
  <input type="color" id="pcl" title="Arrow colour">
  <select id="phd"><option value="end">One-way arrow</option><option value="both">Two-way arrow</option><option value="none">No arrowhead</option></select>

  <button id="prev">Reverse</button><button id="pstr">Straighten</button><button id="pdel">Delete</button></span>
  <span id="ps" hidden><label>Fill <input type="color" id="sfl"></label><label>Outline <input type="color" id="ssk"></label><button id="sfree" title="Stop following the box it is snapped to">Detach</button><button id="sdel">Delete shape</button></span>
</div>
<script>
const TYPES={system:"System",module:"Part / Module",source:"Data comes from",data:"Data collected",store:"Where it is stored",note:"Note"};
const TCOL={system:"#1c2430",module:"#1f6fb5",source:"#c2710c",data:"#1b8a5a",store:"#7a3fb0",note:"#6b7280"};
const PAL=["#1f6fb5","#c2710c","#1b8a5a","#7a3fb0","#c0392b","#0e7c86"];
const KEY="system-map-v1";
const $=id=>document.getElementById(id);
const page=$("page"),ov=$("ov"),tree=$("tree"),panel=$("panel");
let S={title:"",date:"",by:"",roots:[],arrows:[]},sel=null,mode=null,drag=null,undo=[],redo=[],selS=null,G={},VIS=null,ANC=new Set(),favs=[],pickFor=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(name,type,note,kids,color)=>({id:uid(),name,type,note:note||"",rt:note?0:1,open:true,color:color||"",kids:kids||[]});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const today=()=>new Date().toISOString().slice(0,10);

function toRT(t){return esc(t||"").replace(/\n/g,"<br>")}
function fix(list,inh){list.forEach((n,i)=>{if(!n.color)n.color=inh||PAL[i%PAL.length];
  if(!n.rt){n.note=toRT(n.note);n.rt=1}
  (n.comments||[]).forEach(c=>{if(!c.rt){c.text=toRT(c.text);c.rt=1}});
  fix(n.kids,n.color)})}
const SH=()=>S.shapes||(S.shapes=[]);
function val(el){const v=el.isContentEditable?el.innerHTML:el.value;return v.replace(/^(<br>)+$/,"")}
function fixAll(){S.arrows=S.arrows||[];S.pos=S.pos||{};S.shapes=S.shapes||[];fix(S.roots,"")}
const DBKEY="flowmap-v2";
let DB={maps:[],cur:null};
function dbSave(){try{localStorage.setItem(DBKEY,JSON.stringify(DB))}catch(e){}}
function curMap(){return DB.maps.find(m=>m.id===DB.cur)}
function save(){
  let m=curMap();
  if(!m){m={id:uid(),name:uniq(S.title||"Untitled map"),data:S};DB.maps.push(m);DB.cur=m.id;fillMapSel()}
  m.data=S;dbSave();
}

function snap(){undo.push(JSON.stringify(S));if(undo.length>60)undo.shift();redo=[]}
function restoreS(j){S=JSON.parse(j);sel=null;selS=null;syncMeta();save();render()}
function doUndo(){const s=undo.pop();if(!s){msg("Nothing to undo",1500);return}redo.push(JSON.stringify(S));restoreS(s)}
function doRedo(){const s=redo.pop();if(!s){msg("Nothing to redo",1500);return}undo.push(JSON.stringify(S));restoreS(s)}
function msg(t,ms){const m=$("msg");m.textContent=t||"";m.hidden=!t;if(ms)setTimeout(()=>{if(m.textContent===t)m.hidden=true},ms)}
function find(id,list=S.roots,parent=null){
  for(let i=0;i<list.length;i++){
    if(list[i].id===id)return{list,i,parent};
    const f=find(id,list[i].kids,list[i]);if(f)return f;
  }return null;
}
function ids(n,set=new Set()){set.add(n.id);n.kids.forEach(k=>ids(k,set));return set}

/* ---------- tree ---------- */
const ICONS={
server:['Server','<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>'],
system:['System / App','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/>'],
database:['Database','<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'],
cloud:['Cloud','<path d="M7 18h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.5 9.5 4.3 4.3 0 0 0 7 18z"/>'],
spreadsheet:['Spreadsheet','<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7M12 11v8"/>'],
table:['Table','<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 10h18M3 14.5h18M9 5v14"/>'],
report:['Report','<path d="M6 3h12v18H6z"/><path d="M9 17v-4M12 17V9M15 17v-6"/>'],
document:['Document','<path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/>'],
form:['Form','<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8l1.2 1.2L11.5 7M13 8.5h3M8 14l1.2 1.2L11.5 13M13 14.5h3"/>'],
query:['Query','<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>'],
api:['Connection / API','<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12h7"/>'],
email:['Email','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6.5L20.5 7"/>'],
person:['Person / Team','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'],
folder:['Folder','<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>']};
const DEFI={system:"system",module:"folder",source:"api",data:"table",store:"database",note:"document"};
const svgI=(k,z=22)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${(ICONS[k]||ICONS.folder)[1]}</svg>`;
const BUB='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>';
const CLIP='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>';
const OPENI='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function cleanUrl(u){u=(u||"").trim();if(!u)return"";if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;return /^https?:\/\//i.test(u)?u:""}
function hostOf(u){try{return new URL(cleanUrl(u)).hostname.replace(/^www\./,"")}catch(e){return""}}
function svcOf(u){const h=hostOf(u);
  if(/(^|\.)(drive|docs)\.google\.com$/.test(h))return"Google Drive";
  if(/(^|\.)dropbox\.com$/.test(h))return"Dropbox";
  if(/(sharepoint\.com|onedrive\.live\.com|1drv\.ms)$/.test(h))return"OneDrive / SharePoint";
  if(/(^|\.)box\.com$/.test(h))return"Box";
  return h||"Link"}
function dpHTML(d){const t=d.t||hostOf(d.u)||"Link",v=driveLabel(d)||svcOf(d.u);return `<a href="${esc(cleanUrl(d.u)||"#")}">${esc(t)}</a>${v!==t?` <span class="dh">· ${esc(v)}</span>`:""}`}
const DRKEY="flowmap-drives",LDKEY="flowmap-lastdrive";
const DTYPES={google:"Google Drive",dropbox:"Dropbox",onedrive:"OneDrive / SharePoint",box:"Box",other:"Other"};
let DRIVES=[];
try{DRIVES=JSON.parse(localStorage.getItem(DRKEY)||"[]")}catch(e){}
if(!Array.isArray(DRIVES))DRIVES=[];
function drSave(){try{localStorage.setItem(DRKEY,JSON.stringify(DRIVES))}catch(e){}}
function lastDrive(){let id="";try{id=localStorage.getItem(LDKEY)||""}catch(e){}return DRIVES.some(r=>r.id===id)?id:""}
function driveLabel(d){const r=DRIVES.find(x=>x.id===d.dr);return r?(r.name||DTYPES[r.type]):(d.dn||"")}
function driveOptions(sel,dn){
  let o='<option value="">No drive</option>'+DRIVES.map(r=>`<option value="${r.id}"${r.id===sel?" selected":""}>${esc(r.name||DTYPES[r.type])}</option>`).join("");
  if(sel&&!DRIVES.some(r=>r.id===sel))o+=`<option value="${esc(sel)}" selected>${esc(dn||"Removed drive")} (removed)</option>`;
  return o;
}
function typeOpts(sel){return Object.entries(DTYPES).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v}</option>`).join("")}
function driveRow(r){return `<div class="dvr"><input data-drid="${r.id}" data-drf="name" value="${esc(r.name)}" placeholder="Name"><select data-drid="${r.id}" data-drf="type">${typeOpts(r.type)}</select><input data-drid="${r.id}" data-drf="url" value="${esc(r.url||"")}" placeholder="Main folder link (optional)"><a class="dvo" href="${esc(cleanUrl(r.url)||"#")}" target="_blank" rel="noopener noreferrer" title="Open this drive">Open ↗</a><button data-drdel="${r.id}" title="Remove drive">✕</button></div>`}
function relabelDrive(r){
  DB.maps.forEach(m=>{const w=l=>(l||[]).forEach(n=>{(n.docs||[]).forEach(d=>{if(d.dr===r.id)d.dn=r.name});w(n.kids)});w(m.data.roots)});
  dbSave();
}
function addDrive(){
  const name=$("dvn").value.trim(),type=$("dvt").value,raw=$("dvu").value.trim(),url=raw?cleanUrl(raw):"";
  if(!name){msg("Give the drive a name first",2500);return}
  if(raw&&!url){msg("The folder link must start with http or https",3000);return}
  DRIVES.push({id:uid(),name,type,url});drSave();settingsHTML();render();
}
$("settings").addEventListener("change",e=>{
  const id=e.target.dataset.drid;if(!id)return;
  const r=DRIVES.find(x=>x.id===id);if(!r)return;
  const f=e.target.dataset.drf,v=e.target.value,row=e.target.closest(".dvr");
  if(f==="url"){
    const u=v.trim()?cleanUrl(v):"";
    if(v.trim()&&!u){msg("The folder link must start with http or https",3000);e.target.value=r.url||"";return}
    r.url=u;e.target.value=u;row.querySelector(".dvo").href=u||"#";
  }else r[f]=v;
  if(f==="name")relabelDrive(r);
  drSave();render();
});
$("settings").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!b.dataset.drdel)return;
  if(!confirm("Remove this drive? Links already tagged with it keep its name."))return;
  DRIVES=DRIVES.filter(x=>x.id!==b.dataset.drdel);drSave();settingsHTML();render();
});
function calcVis(){
  VIS=null;ANC=new Set();
  const live=(S.focus||[]).filter(id=>find(id));if(!live.length)return;
  VIS=new Set();
  live.forEach(id=>{const f=find(id);ids(f.list[f.i],VIS);let p=f.parent;while(p){VIS.add(p.id);ANC.add(p.id);p=(find(p.id)||{}).parent}});
}
function nodeHTML(n){
  const opts=Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${k===n.type?" selected":""}>${v}</option>`).join("");
  const kids=VIS?n.kids.filter(k=>VIS.has(k.id)):n.kids;
  const open=n.open||ANC.has(n.id);
  const cm=n.comments||[],cc=cm.length,dm=n.docs||[],dc=dm.length;
  const cnt=n.kids.length?`<span class="count">${n.kids.length}</span>`:"";
  const cbox=`<div class="cbox${n.cOpen?" open":""}${cc?" has":""}">${cm.map(c=>`<div class="cm"><div class="note rt" contenteditable="true" data-cid="${c.id}">${c.text||""}</div><span class="ct">${esc(c.d||"")}</span><button data-a="cdel" data-cid="${c.id}" title="Delete comment">✕</button></div>`).join("")}<div class="cadd"><input class="cnew" placeholder="Add a comment"><button data-a="cadd">Add</button></div></div>`;
  const dbox=`<div class="dbox${n.dOpen?" open":""}${dc?" has":""}">${dm.map(d=>`<div class="dr"><a class="dopen" data-did="${d.id}" href="${esc(cleanUrl(d.u)||"#")}" target="_blank" rel="noopener noreferrer" title="Open (${esc(driveLabel(d)||svcOf(d.u))})">${OPENI}</a>${DRIVES.length||d.dr?`<select class="drsel" data-did="${d.id}" data-df="dr" title="Which drive">${driveOptions(d.dr,d.dn)}</select>`:""}<input class="din" data-did="${d.id}" data-df="t" value="${esc(d.t||"")}" placeholder="Name"><input class="din" data-did="${d.id}" data-df="u" value="${esc(d.u||"")}" placeholder="Link"><button data-a="ddel" data-did="${d.id}" title="Remove link">✕</button></div><div class="dp" data-did="${d.id}">${dpHTML(d)}</div>`).join("")}<div class="dadd">${DRIVES.length?`<select class="dnew-d" title="Which drive">${driveOptions(lastDrive())}</select>`:""}<input class="dnew-t" placeholder="Name (optional)"><input class="dnew-u" placeholder="Paste a Google Drive, Dropbox or other link"><button data-a="dadd">Add</button>${DRIVES.length?"":'<div class="hint" style="width:100%">Tip: add your drives in Settings (the gear) to tag each link with a drive.</div>'}</div></div>`;
  return `<div class="node${open?"":" collapsed"}" data-id="${n.id}" style="--own:${n.color}">
    <div class="card">
      <div class="head">
        <button class="grip" title="Drag to move this system">⠿</button>
        <input type="color" class="clr" data-f="color" value="${n.color}" title="Line colour for this box and what is inside it">
        <button class="ic" data-a="icon" title="Change icon">${svgI(n.icon||DEFI[n.type])}</button>
        <select class="ty-${n.type}" data-f="type" aria-label="Type">${opts}</select>
        <input class="name" data-f="name" value="${esc(n.name)}" placeholder="Name this box">
        ${cnt}
        <button class="cb${cc?" has":""}" data-a="cmt" title="Comments">${BUB}${cc||""}</button>
        <button class="cb db${dc?" has":""}" data-a="docs" title="Documents and links">${CLIP}${dc||""}</button>
        <div class="tools">
          <button data-a="toggle" title="Collapse or expand">${open?"▾":"▸"}</button>
          <button data-a="child" title="Add a box inside this one">+</button>
          <button data-a="up" title="Move up">↑</button>
          <button data-a="down" title="Move down">↓</button>
          <button data-a="del" title="Delete">✕</button>
        </div>
      </div>
      <div class="note rt" contenteditable="true" data-f="note" data-ph="Notes: how is data collected, how often, who owns it, how it is stored">${n.note||""}</div>
      ${cbox}
      ${dbox}
    </div>
    <div class="rsz" data-rsz title="Drag to resize"></div>
    ${kids.length?`<div class="kids">${kids.map(nodeHTML).join("")}</div>`:""}
  </div>`;
}
function render(){
  calcVis();
  const roots=S.roots.filter(r=>!VIS||VIS.has(r.id));
  tree.innerHTML=roots.length?roots.map(nodeHTML).join(""):`<div class="empty">Nothing here yet. Open the menu (three lines, top corner) and press the box button to add your first box.</div>`;
  tree.querySelectorAll(".node").forEach(el=>el.classList.toggle("root",!el.parentElement.classList.contains("kids")));
  const live=VIS?(S.focus||[]).filter(id=>find(id)).length:0;
  $("focusBtn").dataset.n=live||"";$("focusBtn").title=live?`Focus: ${live} chosen`:"Focus on chosen boxes";
  $("focusBtn").classList.toggle("on",!!live);
  $("fnote").hidden=!live;
  $("fnote").innerHTML=`Showing only the boxes you picked. <button onclick="clearFocus()">Show everything</button>`;
  if(!$("fp").hidden)fpHTML();
  if(isFree())applyFree();
  renderShapes();
  fit();updatePanel();
}
function fit(){sizeCanvas();draw()}
function paint(n,old){
  if(n.color!==old&&false)return;
}
function recolor(n,old,nu){
  n.color=nu;
  const el=tree.querySelector(`.node[data-id="${n.id}"]`);
  if(el){el.style.setProperty("--own",nu);const c=el.querySelector(":scope>.card .clr");if(c)c.value=nu}
  n.kids.forEach(k=>{if(k.color===old)recolor(k,old,nu)});
}
tree.addEventListener("focusin",e=>{if(e.target.type==="color")snap()});
tree.addEventListener("input",e=>{
  const el=e.target.closest(".node");if(!el)return;
  const f=find(el.dataset.id);if(!f)return;
  const n=f.list[f.i],k=e.target.dataset.f;
  if(e.target.dataset.did){
    const d=(n.docs||[]).find(x=>x.id===e.target.dataset.did);
    if(d){d[e.target.dataset.df]=e.target.value;if(e.target.dataset.df==="dr"){const rv=DRIVES.find(x=>x.id===d.dr);d.dn=rv?rv.name:undefined;if(!d.dr)delete d.dr}save();
      const dp=el.querySelector(`.dp[data-did="${d.id}"]`);if(dp)dp.innerHTML=dpHTML(d);
      const an=el.querySelector(`a.dopen[data-did="${d.id}"]`);if(an)an.href=cleanUrl(d.u)||"#"}
    return}
  if(e.target.dataset.cid){const c=(n.comments||[]).find(x=>x.id===e.target.dataset.cid);if(c){c.text=val(e.target);fit();save()}return}
  if(k==="color"){recolor(n,n.color,e.target.value);save();return}
  if(k==="type"){n.type=e.target.value;e.target.className="ty-"+n.type;save();return}
  if(k){n[k]=val(e.target);if(k==="note")fit();save()}
});

function cardEl(id){
  if(VIS&&!VIS.has(id))return null;
  let cur=id;
  while(cur){
    const el=tree.querySelector(`.node[data-id="${cur}"]>.card`);
    if(el&&el.offsetParent)return el;
    const f=find(cur);cur=f&&f.parent?f.parent.id:null;
  }return null;
}
function endPt(e){
  if(e.node){const el=cardEl(e.node);if(!el)return null;
    const r=el.getBoundingClientRect(),p=page.getBoundingClientRect();
    const R={w:r.width,h:r.height};return{c:{x:r.left-p.left+R.w/2,y:r.top-p.top+R.h/2},r:R}}
  if(e.shape){
    const el=$("shapes").querySelector(`[data-sid="${e.shape}"]`);if(!el||el.style.display==="none")return null;
    const r=el.getBoundingClientRect(),p=page.getBoundingClientRect(),sh=SH().find(x=>x.id===e.shape);
    return{c:{x:r.left-p.left+r.width/2,y:r.top-p.top+r.height/2},r:{w:r.width,h:r.height,ell:!!sh&&sh.kind==="circle"}};
  }
  return{c:{x:e.x,y:e.y},r:null};
}
function clip(R,c,to){
  const dx=to.x-c.x,dy=to.y-c.y;if(!dx&&!dy)return c;
  if(R.ell){const k=Math.min(1/Math.hypot(dx/(R.w/2),dy/(R.h/2)),1);return{x:c.x+dx*k,y:c.y+dy*k}}
  const t=Math.min(dx?R.w/2/Math.abs(dx):1e9,dy?R.h/2/Math.abs(dy):1e9,1);
  return{x:c.x+dx*t,y:c.y+dy*t};
}
function draw(){
  positionShapes();
  ov.setAttribute("width",page.clientWidth);ov.setAttribute("height",page.clientHeight);
  let defs="",h="";G={};
  for(const a of S.arrows){
    const A=endPt(a.from),B=endPt(a.to);if(!A||!B)continue;
    const mid={x:(A.c.x+B.c.x)/2,y:(A.c.y+B.c.y)/2},bd=a.bend||{x:0,y:0};
    const C={x:mid.x+bd.x,y:mid.y+bd.y};
    const P=A.r?clip(A.r,A.c,C):A.c,Q=B.r?clip(B.r,B.c,C):B.c;
    const M={x:.25*P.x+.5*C.x+.25*Q.x,y:.25*P.y+.5*C.y+.25*Q.y};
    G[a.id]={M};
    const d=`M${P.x} ${P.y}Q${C.x} ${C.y} ${Q.x} ${Q.y}`;
    const dash=a.style==="dashed"?"9 6":a.style==="dotted"?"1 7":"none";
    const on=a.id===sel;
    if(a.head!=="none")defs+=`<marker id="m${a.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="${a.color}"/></marker>`;
    const mk_=a.head==="none"?"":(a.head==="both"?`marker-start="url(#m${a.id})" `:"")+`marker-end="url(#m${a.id})"`;
    h+=`<path d="${d}" fill="none" stroke="${a.color}" stroke-width="${on?3.5:2.5}" stroke-dasharray="${dash}" stroke-linecap="round" ${mk_}/>`;
    h+=`<path d="${d}" fill="none" stroke="transparent" stroke-width="16" data-aid="${a.id}" style="pointer-events:stroke;cursor:pointer"/>`;
    if(a.label)h+=`<text x="${M.x}" y="${M.y-7}" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="${a.color}" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${esc(a.label)}</text>`;
    if(on){
      const hs=(x,y,k,sq)=>sq?`<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="#fff" stroke="#2563eb" stroke-width="2.5" data-aid="${a.id}" data-h="${k}" style="pointer-events:all;cursor:grab;touch-action:none"/>`
        :`<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#2563eb" stroke-width="2.5" data-aid="${a.id}" data-h="${k}" style="pointer-events:all;cursor:grab;touch-action:none"/>`;
      h+=hs(P.x,P.y,"s")+hs(Q.x,Q.y,"e")+hs(M.x,M.y,"m",1);
    }
  }
  ov.innerHTML=`<defs>${defs}</defs>${h}`;
}

  if(e.key==="Enter"&&c&&(c.contains("dnew-u")||c.contains("dnew-t"))){e.preventDefault();e.target.closest(".dbox").querySelector('[data-a="dadd"]').click()}
});
const FAVKEY="system-map-favs";
try{favs=JSON.parse(localStorage.getItem(FAVKEY)||"[]")}catch(e){}
tree.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("cnew")){e.preventDefault();e.target.closest(".card").querySelector('[data-a="cadd"]').click()}});
function cell(k){const f=favs.includes(k);return `<div class="pc"><button class="pb" data-pick="${k}" title="${ICONS[k][0]}">${svgI(k)}<span>${ICONS[k][0]}</span></button><button class="pf${f?" on":""}" data-fav="${k}" title="${f?"Remove from favourites":"Add to favourites"}">${f?"★":"☆"}</button></div>`}
function pickHTML(){const fv=favs.filter(k=>ICONS[k]);$("pick").innerHTML=`<div class="ph">Favourites</div><div class="pg">${fv.length?fv.map(cell).join(""):'<span class="hint" style="grid-column:1/-1">Tap the star on an icon to keep it here.</span>'}</div><div class="ph">All icons</div><div class="pg">${Object.keys(ICONS).map(cell).join("")}</div>`}
function openPick(id,btn){
  pickFor=id;const p=$("pick");p.hidden=false;pickHTML();
  const r=btn.getBoundingClientRect();
  p.style.left=Math.max(8,Math.min(r.left,innerWidth-p.offsetWidth-8))+"px";
  p.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-p.offsetHeight-8))+"px";
}
$("pick").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.fav){const k=b.dataset.fav;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];try{localStorage.setItem(FAVKEY,JSON.stringify(favs))}catch(x){}pickHTML();return}
  if(b.dataset.pick){const f=find(pickFor);if(f){snap();f.list[f.i].icon=b.dataset.pick;save()}$("pick").hidden=true;render()}
});
document.addEventListener("pointerdown",e=>{if(!$("pick").hidden&&!e.target.closest("#pick")&&!e.target.closest(".ic"))$("pick").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("pick").hidden=true;$("fp").hidden=true}});

function toggleFocus(){const p=$("fp");p.hidden=!p.hidden;if(!p.hidden)fpHTML()}
function fpHTML(){
  let h="";const w=(l,d)=>l.forEach(n=>{h+=`<label style="padding-left:${d*16}px"><input type="checkbox" data-fid="${n.id}"${(S.focus||[]).includes(n.id)?" checked":""}> <span style="color:${n.color}">${esc(n.name||"(unnamed)")}</span></label>`;w(n.kids,d+1)});w(S.roots,0);
  $("fp").innerHTML=`<div class="fh">Tick the boxes to show. Everything else is hidden, and what is inside a ticked box stays visible.</div><div class="fl">${h||"No boxes yet"}</div><div class="fb"><button data-fx="all">Show everything</button><button data-fx="close">Done</button></div>`;
}
$("fp").addEventListener("change",e=>{const id=e.target.dataset.fid;if(!id)return;const f=S.focus||[];S.focus=e.target.checked?[...f,id]:f.filter(x=>x!==id);save();render()});
$("fp").addEventListener("click",e=>{const x=e.target.dataset.fx;if(x==="all")clearFocus();if(x==="close")$("fp").hidden=true});
function clearFocus(){S.focus=[];save();render()}

let UI={open:false,dock:"top",ghost:false,layout:"list"};
const UIKEY="system-map-ui";
try{Object.assign(UI,JSON.parse(localStorage.getItem(UIKEY)||"{}"))}catch(e){}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}}
function isFree(){return UI.layout==="free"&&!document.body.classList.contains("printing")}
function applyUI(){
  const c=document.body.classList;
  c.toggle("m-open",UI.open);
  ["top","left","right"].forEach(d=>c.toggle("d-"+d,UI.dock===d));
  c.toggle("free",UI.layout==="free");
  $("hb").classList.toggle("ghost",UI.ghost&&!UI.open);
  [["Top","top"],["Left","left"],["Right","right"]].forEach(([n,d])=>$("dk"+n).classList.toggle("sel",UI.dock===d));
  $("lyList").classList.toggle("sel",UI.layout==="list");
  $("lyFree").classList.toggle("sel",UI.layout==="free");
}
function toggleMenu(){UI.open=!UI.open;UI.ghost=false;saveUI();applyUI();fit()}
function hideMenu(){UI.open=false;UI.ghost=true;saveUI();applyUI();fit()}
function setDock(d){UI.dock=d;saveUI();applyUI();fit()}
function setLayout(l){UI.layout=l;saveUI();applyUI();render()}

function applyFree(){
  S.pos=S.pos||{};
  let nx=Math.max(0,...S.roots.filter(r=>S.pos[r.id]).map(r=>S.pos[r.id].x+S.pos[r.id].w+40));
  tree.querySelectorAll(":scope>.node").forEach(el=>{
    let p=S.pos[el.dataset.id];
    if(!p){p=S.pos[el.dataset.id]={x:nx,y:0,w:520};nx+=560;save()}
    el.style.setProperty("--x",p.x+"px");el.style.setProperty("--y",p.y+"px");el.style.setProperty("--w",p.w+"px");
  });
}
function sizeCanvas(){
  if(!isFree()){tree.style.width=tree.style.height="";return}
  let w=900,h=300;
  tree.querySelectorAll(":scope>.node").forEach(el=>{w=Math.max(w,el.offsetLeft+el.offsetWidth+80);h=Math.max(h,el.offsetTop+el.offsetHeight+80)});
  tree.style.width=w+"px";tree.style.height=h+"px";
}
let bdrag=null;
tree.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip"),r=e.target.closest("[data-rsz]");
  if((!g&&!r)||!isFree())return;
  const el=e.target.closest(".node.root");if(!el)return;
  S.pos=S.pos||{};const p=S.pos[el.dataset.id];if(!p)return;
  e.preventDefault();snap();
  bdrag={el,p,mode:g?"move":"size",sx:e.clientX,sy:e.clientY,x:p.x,y:p.y,w:p.w};
});
window.addEventListener("pointermove",e=>{
  if(!bdrag)return;
  const dx=e.clientX-bdrag.sx,dy=e.clientY-bdrag.sy,p=bdrag.p,st=bdrag.el.style;
  if(bdrag.mode==="move"){p.x=Math.max(0,bdrag.x+dx);p.y=Math.max(0,bdrag.y+dy);st.setProperty("--x",p.x+"px");st.setProperty("--y",p.y+"px")}
  else{p.w=Math.max(260,bdrag.w+dx);st.setProperty("--w",p.w+"px")}
  sizeCanvas();draw();
});
window.addEventListener("pointerup",()=>{if(bdrag){bdrag=null;save()}});


/* ---------- shapes ---------- */
function shapePos(s){
  const a=s.a;
  if(a&&a.node){
    const c=cardEl(a.node);if(!c)return null;
    const r=c.getBoundingClientRect(),p=page.getBoundingClientRect(),L=r.left-p.left,T=r.top-p.top;
    if(a.side==="right")return{x:L+r.width+12,y:T+a.along};
    if(a.side==="left")return{x:L-12-s.w,y:T+a.along};
    if(a.side==="top")return{x:L+a.along,y:T-12-s.h};
    return{x:L+a.along,y:T+r.height+12};
  }
  return{x:a?a.x:40,y:a?a.y:40};
}
function positionShapes(){
  $("shapes").querySelectorAll(".shape").forEach(el=>{
    const s=SH().find(x=>x.id===el.dataset.sid);if(!s)return;
    const p=shapePos(s);
    if(!p){el.style.display="none";return}
    el.style.display="";el.style.left=p.x+"px";el.style.top=p.y+"px";el.style.width=s.w+"px";el.style.height=s.h+"px";
    el.classList.toggle("sel",s.id===selS);
  });
}
function renderShapes(){
  $("shapes").innerHTML=SH().map(s=>`<div class="shape" data-sid="${s.id}"><div class="sbody ${s.kind}" style="background:${s.fill};border-color:${s.stroke}"><div class="stext rt" contenteditable="true" data-ph="Label" data-sid="${s.id}">${s.text||""}</div></div><div class="srz" title="Drag to resize"></div></div>`).join("");
  draw();
}
function curShape(){return SH().find(x=>x.id===selS)}
function selShape(id){selS=id;sel=null;updatePanel();draw()}
function addShape(kind){
  snap();
  const pr=page.getBoundingClientRect();
  const x=Math.max(20,Math.min(page.clientWidth-200,innerWidth/2-pr.left-60)),y=Math.max(60,-pr.top+140);
  const s={id:uid(),kind,w:kind==="circle"?110:140,h:kind==="circle"?110:80,fill:"#ffffff",stroke:"#1c2430",text:"",a:{x:Math.round(x/10)*10,y:Math.round(y/10)*10}};
  SH().push(s);save();renderShapes();selShape(s.id);
}
function delShape(){
  const s=curShape();if(!s)return;snap();
  S.shapes=SH().filter(x=>x.id!==s.id);
  S.arrows=S.arrows.filter(r=>r.from.shape!==s.id&&r.to.shape!==s.id);
  selS=null;save();renderShapes();updatePanel();
}
function nearestCard(s){
  const p=page.getBoundingClientRect(),a=shapePos(s);if(!a)return null;
  let best=null;
  document.querySelectorAll("#tree .card").forEach(c=>{
    if(!c.offsetParent)return;
    const r=c.getBoundingClientRect(),cr={l:r.left-p.left,t:r.top-p.top,r:r.right-p.left,b:r.bottom-p.top};
    const dx=Math.max(cr.l-(a.x+s.w),a.x-cr.r,0),dy=Math.max(cr.t-(a.y+s.h),a.y-cr.b,0),d=Math.hypot(dx,dy);
    if(!best||d<best.d)best={d,c,cr,id:c.closest(".node").dataset.id};
  });
  return best&&best.d<=80?best:null;
}
function snapShape(s){
  const a=shapePos(s),b=nearestCard(s),G=10;
  if(!a)return;
  if(!b){s.a={x:Math.round(a.x/G)*G,y:Math.round(a.y/G)*G};return}
  const cw=b.cr.r-b.cr.l,ch=b.cr.b-b.cr.t;
  const nx=(a.x+s.w/2-(b.cr.l+cw/2))/(cw/2+s.w/2),ny=(a.y+s.h/2-(b.cr.t+ch/2))/(ch/2+s.h/2);
  let side,along,lim,sz;
  if(Math.abs(nx)>Math.abs(ny)){side=nx>0?"right":"left";along=a.y-b.cr.t;lim=ch;sz=s.h}
  else{side=ny>0?"bottom":"top";along=a.x-b.cr.l;lim=cw;sz=s.w}
  along=Math.round(Math.max(-sz/2,Math.min(lim-sz/2,along))/G)*G;
  s.a={node:b.id,side,along};
}
function endTarget(e){
  for(const x of document.elementsFromPoint(e.clientX,e.clientY)){
    const sh=x.closest&&x.closest(".shape");if(sh)return{shape:sh.dataset.sid};
    const c=x.closest&&x.closest(".card");if(c)return{node:c.closest(".node").dataset.id};
  }return null;
}
let sdrag=null;
$("shapes").addEventListener("pointerdown",e=>{
  const el=e.target.closest(".shape");if(!el)return;
  const id=el.dataset.sid;if(selS!==id)selShape(id);
  if(e.target.closest(".stext"))return;
  e.preventDefault();
  const s=SH().find(x=>x.id===id),p=shapePos(s)||{x:0,y:0},q=rel(e);
  sdrag=e.target.classList.contains("srz")?{s,mode:"size",sx:q.x,sy:q.y,w:s.w,h:s.h}:{s,mode:"move",ox:q.x-p.x,oy:q.y-p.y};
});
window.addEventListener("pointermove",e=>{
  if(!sdrag)return;
  const s=sdrag.s,q=rel(e);
  if(!sdrag.moved){snap();sdrag.moved=true}
  if(sdrag.mode==="move"){
    s.a={x:q.x-sdrag.ox,y:q.y-sdrag.oy};
    document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
    const b=nearestCard(s);if(b)b.c.classList.add("drop");
  }else{s.w=Math.max(40,sdrag.w+q.x-sdrag.sx);s.h=Math.max(40,sdrag.h+q.y-sdrag.sy)}
  draw();
});
window.addEventListener("pointerup",()=>{
  if(!sdrag)return;
  const s=sdrag.s;document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
  if(sdrag.moved&&sdrag.mode==="move")snapShape(s);
  sdrag=null;save();draw();
});
$("shapes").addEventListener("input",e=>{
  const t=e.target.closest(".stext");if(!t)return;
  const s=SH().find(x=>x.id===t.dataset.sid);if(s){s.text=val(t);save()}
});
document.addEventListener("pointerdown",e=>{
  if(!selS||sdrag)return;
  if(e.target.closest(".shape")||e.target.closest("#panel"))return;
  selS=null;draw();updatePanel();
});
$("ps").addEventListener("focusin",snap);
$("ps").addEventListener("input",()=>{
  const s=curShape();if(!s)return;
  s.fill=$("sfl").value;s.stroke=$("ssk").value;
  const b=$("shapes").querySelector(`[data-sid="${s.id}"] .sbody`);if(b){b.style.background=s.fill;b.style.borderColor=s.stroke}
  save();
});
$("sdel").onclick=delShape;
$("sfree").onclick=()=>{const s=curShape();if(!s)return;const p=shapePos(s);if(p){snap();s.a={x:Math.round(p.x),y:Math.round(p.y)};save();draw()}};

/* ---------- text formatting + redo shortcuts ---------- */
const fmt=$("fmt");
function placeFmt(){const a=document.activeElement;if(a&&a.classList&&a.classList.contains("rt")){const r=a.getBoundingClientRect();fmt.hidden=false;fmt.style.left=Math.max(8,r.left)+"px";fmt.style.top=Math.max(8,r.top-40)+"px"}}
document.addEventListener("focusin",placeFmt);
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains("rt")))fmt.hidden=true},0));
window.addEventListener("scroll",()=>{if(!fmt.hidden)placeFmt()},true);
["mousedown","pointerdown"].forEach(t=>fmt.addEventListener(t,e=>e.preventDefault()));
fmt.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.execCommand(b.dataset.c);
  const a=document.activeElement;if(a)a.dispatchEvent(new Event("input",{bubbles:true}));
});
document.addEventListener("paste",e=>{
  const t=e.target;if(t.classList&&t.classList.contains("rt")){e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"))}
});
document.addEventListener("keydown",e=>{
  const t=document.activeElement,typing=t&&(t.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(t.tagName));
  const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(m&&!typing&&(k==="y"||(k==="z"&&e.shiftKey))){e.preventDefault();doRedo()}
  if((e.key==="Delete"||e.key==="Backspace")&&selS&&!typing){e.preventDefault();delShape()}
});

const FLOPPY=$("saveBtn").innerHTML,CHECK='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function manualSave(){
  save();
  const b=$("saveBtn");b.classList.add("ok");b.innerHTML=CHECK;
  msg("Saved",1300);
  setTimeout(()=>{b.classList.remove("ok");b.innerHTML=FLOPPY},1300);
}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();manualSave()}});
$("legend").innerHTML=Object.entries(TYPES).map(([k,v])=>`<span><i style="background:${TCOL[k]}"></i>${v}</span>`).join("")+`<span class="noprint hint">Line colours: set per box with the round colour button</span>`;
applyUI();
initMaps();
window.addEventListener("resize",draw);
window.addEventListener("beforeprint",()=>{sel=null;updatePanel();document.body.classList.add("printing");fit()});
window.addEventListener("afterprint",()=>{document.body.classList.remove("printing");fit()});
if(window.ResizeObserver)new ResizeObserver(draw).observe(page);

/* ---------- offline support (installed app) ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
</script>
